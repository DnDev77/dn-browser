server {
    listen 80;
    server_name h2proxy.centralcity.gg;
    gzip off;

    location / {
        proxy_pass https://wwww.h2.bet.br;
        proxy_ssl_server_name on;
        proxy_set_header Host www.h2.bet.br;
        proxy_set_header Referer https://wwww.h2.bet.br;
        proxy_set_header Origin https://wwww.h2.bet.br;
        proxy_set_header User-Agent $http_user_agent;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Feature-Policy;
        proxy_hide_header Report-To;
        proxy_hide_header NEL;
        sub_filter '<link rel="preload"' '<!-- preload removido -->';
        sub_filter_once off;
        sub_filter 'connect.facebook.net' '';
        sub_filter 'datadoghq-browser-agent.com' '';
        sub_filter 'googletagmanager.com' '';
        sub_filter 'google-analytics.com' '';
        sub_filter_types text/html;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "*";
        add_header X-Frame-Options "ALLOWALL";
    }
}
